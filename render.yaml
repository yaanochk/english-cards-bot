services:
  - type: worker
    name: english-cards-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        value: "1152370552"

  - type: cron
    name: english-cards-morning
    schedule: "0 6 * * *"
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    command: "python send_scheduled.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        value: "1152370552"
      - key: QUIZ_COUNT
        value: "5"

  - type: cron
    name: english-cards-evening
    schedule: "0 15 * * *"
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    command: "python send_scheduled.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        value: "1152370552"
      - key: QUIZ_COUNT
        value: "5"
